<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>10월 입고 이슈 현황 보고</title>
<style>
/* ── 색·글꼴 [은영 2026-10-02 리디자인 지시] ──────────────────────────
   흰색·연회색·짙은 회색만 쓴다. 파란색·파스텔은 쓰지 않는다.
   빨강(--red)은 반송·재발·주요 확인사항처럼 **정말 중요한 것에만**.
   값을 한 곳에 모아 두어, 톤을 바꿀 일이 생기면 여기만 고치면 된다. */
:root{
  --bg:#f1f3f5;        /* 화면 바깥 */
  --card:#FFFFFF;      /* 보고서 본문·카드 */
  --ink:#202429;       /* 제목·주요 본문 */
  --sub:#687078;       /* 보조 글씨 */
  --th:#eef0f2;        /* 옅은 회색 바탕 — 딱지·작은 단추 */
  --thbg:#1f3a56;      /* 표 머리글 배경 — 쓰던 남색 [은영 2026-10-02] */
  --thfg:#ffffff;      /* 그 위 글씨 */
  --deep:#1f3a56;      /* 고른 단추·오늘 날짜 같은 '진한 자리' */
  --line:#DEE2E5;      /* 테두리·구분선 */
  --rule:#b9c0c7;      /* 머리말 아래 가르는 선 — 테두리보다 진하게 */
  --red:#A6382B;       /* 강조 */
  --warn:#faf5f4;      /* 경고 영역 배경 */
  --warnln:#ecd9d5;    /* 경고 영역 테두리 */
  --soft:#f7f8f9;      /* 아주 옅은 바탕 */
  --mute:#a5adb4;      /* 값 없음(—) */
  --barfill:#979da3;   /* 막대 채움 — 중간 회색 한 가지 */
  --bartrack:#eceff1;  /* 막대 바탕 */
}
*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,"Pretendard Variable","Noto Sans KR","Malgun Gothic",Arial,sans-serif;
font-size:13px;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.pg{max-width:1320px;margin:24px auto;padding:28px 30px 30px;background:var(--card);
border:1px solid #e7eaed;border-radius:9px}
section{margin-top:32px}

/* ── 표 ─────────────────────────────────────────────────────────── */
table{border-collapse:collapse;width:100%}
th{background:var(--thbg);font-size:12px;font-weight:600;padding:9px 14px;text-align:left;color:var(--thfg)}
td{font-size:13px;padding:8px 14px;height:48px;vertical-align:middle;
border-top:1px solid var(--line);color:var(--ink)}
td.center,th.center{text-align:center}
td.ty2{white-space:nowrap;font-size:12px;color:var(--sub)}
/* 칸 사이 세로선 — 머리글부터 마지막 줄까지 이어진다
   [은영 2026-10-02 "표의 세로 구분선도 시안처럼 추가해줘"] */
.tw th+th{border-left:1px solid rgba(255,255,255,.2)}
.tw td+td{border-left:1px solid var(--line)}
/* 표는 테두리로 감싼 박스 안에 넣는다 — 시안의 가장 큰 특징이다
   [은영 2026-10-02 "GPT 가 보여준 시안이랑 너무 달라"]. */
.tw{overflow:auto;border:1px solid var(--line);border-radius:5px;background:var(--card)}
.hd{background:var(--thbg)}

.hd .fx{color:var(--thfg);font-weight:600;cursor:pointer;user-select:none}
.hd .fx.on{color:#ffd9a8}
.rw{}
.rw td{height:48px}
.rw td.ph{line-height:0}
.pen{margin-left:5px;width:20px;height:18px;padding:0;font:inherit;font-size:11px;line-height:1;
color:var(--sub);background:var(--th);border:1px solid var(--line);border-radius:4px;cursor:pointer;
vertical-align:middle;visibility:hidden}
.rw:hover .pen{visibility:visible}
.pen:hover{background:var(--line)}
/* 이슈유형 딱지 — 색으로 종류를 가르지 않는다. 글로 읽는다 */
.ty{display:inline-block;padding:2px 9px;border-radius:5px;font-size:11.5px;font-weight:600;
white-space:nowrap;background:var(--th);color:var(--ink)}
.ty i{font-style:normal;font-weight:500;color:var(--sub);margin-left:3px}
.qt{text-align:right;font-weight:700;font-size:15px;white-space:nowrap;color:var(--ink)}
.qc,.hd .qc{padding-right:22px}
.qt em{font-style:normal;font-size:11px;font-weight:400;color:var(--sub);margin-left:3px}
.l{text-align:left}
td.l{padding-left:18px}
/* 이슈 내용(첫 줄 진하게) → 품번(둘째 줄 작은 회색)
   [은영 2026-10-02 "'품번 → 발생 내용' 순서를 '발생 내용 → 품번'으로"] */
.iss{font-weight:600;overflow-wrap:anywhere}
.cod{font-size:11px;color:var(--sub);margin-top:3px;overflow-wrap:anywhere}
.vnm{font-size:13px;font-weight:600;color:var(--ink)}
.cd{line-height:1.45}
.wy{margin-left:8px;font-size:11.5px;color:var(--sub)}
.act{font-size:12.5px;color:var(--ink);line-height:1.45}
.act b{font-weight:600;color:var(--sub);margin-right:4px}
.mb{margin-left:6px;width:17px;height:15px;padding:0;font:inherit;font-size:9px;line-height:1;
color:var(--sub);background:var(--th);border:1px solid var(--line);border-radius:3px;cursor:pointer;
vertical-align:middle}
.all{margin-top:5px;padding:6px 9px;background:var(--soft);border:1px solid var(--line);
border-radius:5px;font-size:11.5px;color:var(--sub);line-height:1.55;word-break:break-all}
/* 반복·재발 딱지 — 재발만 빨강 */
.nth{font-size:10px;display:inline-block;padding:2px 6px;border-radius:4px;
background:var(--th);color:#606870;margin-left:5px;white-space:nowrap;font-weight:600}
.nth.hot{background:var(--red);color:#fff}

/* ── 머리말 ─────────────────────────────────────────────────────── */
/* 머리말 아래 선은 카드 테두리와 **같은 색·같은 굵기로 맞닿아** 있어서
   한 줄이 두 줄로 겹쳐 보였다 [은영 2026-10-02 "테두리위에 또 선이 하나
   있는거 같은데"]. 선은 한 톤 진하게 해 제 구실(가르기)을 하게 두고,
   카드와는 틈을 벌려 맞닿지 않게 한다. */
.top{padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--rule)}
.trow{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
margin-top:14px}
.top h1{margin:0 0 6px;font-size:32px;font-weight:800;letter-spacing:-1.1px;line-height:1.25;color:var(--ink)}
.top .dt1{font-size:13px;color:var(--sub)}
.rate{text-align:right}
.rate .r1{font-size:13px;color:var(--sub);font-weight:600}
.rate .r1 b{font-size:20px;font-weight:700;color:var(--ink);margin-left:6px}
.rate .r2{margin:6px 0 0;font-size:12px;color:var(--sub);white-space:nowrap}
.bar1{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
#chips{display:contents}

/* ── 요약 카드 ──────────────────────────────────────────────────── */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
/* 카드를 바탕에서 한 겹 띄운다 [은영 2026-10-02 "카드들 그림자좀 넣어봐줄래?"].
   가까운 그림자로 테두리를 또렷하게 하고, 먼 그림자로 띄운 느낌만 준다.
   ⚠ 짙게 깔면 종이 보고서로 뽑았을 때 지저분해진다 — 옅게. */
.kp{padding:13px 18px;border:1px solid var(--line);border-radius:6px;min-height:88px;
background:var(--card);box-shadow:0 1px 2px rgba(20,28,38,.05),0 3px 10px rgba(20,28,38,.05)}
.kp .t{font-size:13px;font-weight:750;margin-bottom:7px;color:var(--ink)}
.kp .v{display:flex;align-items:center;gap:14px}
.kp .v b{font-size:30px;font-weight:750;line-height:1;color:var(--ink)}
.kp .v b em{font-style:normal;font-size:19px;font-weight:750}
.kp .v s{text-decoration:none;font-size:12px;color:var(--ink);
padding-left:13px;border-left:1px solid var(--line);white-space:nowrap}
/* 재발 카드는 시안대로 늘 빨간 테두리를 두른다 [은영 2026-10-02 "개선요청
   후 재발 쪽에 gpt 처럼 빨간테두리좀 넣어줘"] — 눈이 먼저 가야 할 자리라
   0건인 날에도 자리를 알아보게 둔다. 다만 숫자까지 빨갛게 칠하는 것은
   실제로 재발이 있을 때뿐이다(.live). 0건을 붉게 쓰면 좋은 소식이
   경고처럼 읽힌다. */
.kp.red .t{color:var(--red)}
.kp.hot{border-color:var(--red);box-shadow:0 1px 2px rgba(166,56,43,.10),0 3px 10px rgba(166,56,43,.09)}
.kp.hot .t{color:var(--red)}
.kp.hot.live .v b{color:var(--red)}

/* ── 주요 확인사항 ──────────────────────────────────────────────── */
/* ⚠ display 를 주면 hidden 속성이 먹지 않는다 — 10/1 처럼 짚을 거리가
   없는 날 빈 띠만 덩그러니 떴던 까닭 [은영 2026-10-02 "붉은색 공간이
   비어있는데"]. 이제는 숨기지 않고 셈한 결과를 적는다. */
.note{display:flex;align-items:center;gap:20px;background:var(--warn);
border-left:4px solid var(--red);border-radius:4px;margin-top:18px;padding:12px 16px;
min-height:46px;font-size:13px;color:var(--ink);flex-wrap:wrap}
.note[hidden]{display:none}
.note .nh{font-weight:700;color:var(--red);padding-right:18px;
border-right:1px solid var(--line);white-space:nowrap}
.note b{font-weight:700;color:var(--red)}

/* ── 섹션 머리 ──────────────────────────────────────────────────── */
.sc{display:flex;align-items:baseline;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.sn{color:var(--red);font-size:15px;margin-right:10px;font-weight:750}
.sc h2{margin:0;font-size:19px;font-weight:750;letter-spacing:-.45px;color:var(--ink)}
.sd{font-size:12px;color:var(--sub)}
.lb{font-size:12.5px;font-weight:600;margin:0 0 9px;color:var(--ink)}
.lb.red{color:var(--red)}
.t3{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.t3 .lb{margin:0 0 0 auto;color:var(--sub);font-weight:500}

/* ── 단추 ───────────────────────────────────────────────────────── */
.pick{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);
border-radius:7px;background:var(--card);font:inherit;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer}
.pick.on{background:var(--deep);border-color:var(--deep);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--card)}
.seg button{font:inherit;font-size:12.5px;font-weight:600;padding:7px 16px;border:0;cursor:pointer;
background:var(--card);color:var(--sub)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--deep);color:#fff}
.fold{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);background:none;border:0;cursor:pointer;padding:0}
/* 04 접기 — 쓰던 대로 상자째 옅은 바탕을 깐다
   [은영 2026-10-02 "바탕색 살짝 넣어줘" · "원래 기존과 동일하게"]. */
.logbox{background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:12px 15px}
.logbar{display:flex;align-items:center;gap:7px;width:100%}
.logbody{padding-top:12px}
.sel{font:inherit;font-size:12px;font-weight:600;color:var(--ink);background:var(--card);
border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer}

/* ── 말풍선·고르기 ──────────────────────────────────────────────── */
.tip{position:relative;display:inline-block}
.tip .tt{display:none;position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);
z-index:30;padding:6px 10px;border-radius:6px;background:var(--ink);color:#fff;font-size:12px;
font-weight:500;line-height:1.45;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.tip:hover .tt{display:block}
.dd{position:absolute;z-index:40;padding:7px;background:var(--card);border:1px solid var(--line);
border-radius:7px;box-shadow:0 6px 18px rgba(0,0,0,.14);max-height:300px;overflow:hidden;
min-width:150px;text-align:left;display:flex;flex-direction:column}
.dd .ddl{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.dd label{display:block;font-size:12px;padding:3px 4px;white-space:nowrap;cursor:pointer}
.dd label:hover{background:var(--soft)}
.dd .ddb{flex:0 0 auto;display:flex;gap:6px;margin-top:6px;border-top:1px solid var(--line);
padding-top:7px;background:var(--card)}
.dd .ddb button{font:inherit;font-size:10.5px;font-weight:600;color:var(--ink);background:var(--th);
border:1px solid var(--line);border-radius:5px;padding:3px 9px;cursor:pointer}

/* ── 찾기 ───────────────────────────────────────────────────────── */
.sbox{display:flex;align-items:center;gap:8px;margin-bottom:11px;flex-wrap:wrap}
.sbox input{flex:1 1 260px;max-width:420px;font:inherit;font-size:12.5px;padding:8px 11px;
border:1px solid var(--line);border-radius:7px;color:var(--ink);background:var(--card)}
.sbox input:focus{outline:2px solid var(--line);outline-offset:1px}
.sbox .sx{font:inherit;font-size:11.5px;font-weight:600;color:var(--ink);background:var(--th);
border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer}
.sbox .sgo{font:inherit;font-size:11.5px;font-weight:600;color:#fff;background:var(--deep);
border:1px solid var(--deep);border-radius:6px;padding:6px 14px;cursor:pointer}
.sbox .sgo:hover{opacity:.88}
.sbox .sn{font-size:11.5px;color:var(--sub);letter-spacing:0}

/* ── 달력 ───────────────────────────────────────────────────────── */
.cal{width:252px}
.cal .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:7px}
.cal .ch b{font-size:12.5px;color:var(--deep)}
.cal .ch .cmv{width:24px;height:22px;padding:0;font:inherit;font-size:13px;line-height:1;color:var(--ink);
background:var(--th);border:1px solid var(--line);border-radius:5px;cursor:pointer}
.cal .ch .cmv[disabled]{opacity:.35;cursor:default}
.cal .cw{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .cw span{text-align:center;font-size:10px;color:var(--sub);padding:2px 0}
.cal .cw span.sun{color:var(--red)}
.cal .cd0{height:30px;border:0;background:none;font:inherit;font-size:11.5px;color:var(--mute);border-radius:6px}
.cal button.day{cursor:pointer;color:var(--ink);position:relative}
.cal button.day:hover{background:var(--th)}
.cal button.day.on{background:var(--deep);color:#fff;font-weight:700}
.cal button.day i{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);
width:4px;height:4px;border-radius:50%;background:var(--red)}
.cal button.day.on i{background:#fff}
.cal .cn{margin-top:6px;font-size:10px;color:var(--sub);text-align:center}

/* ── 누적 막대 — 회색 한 가지. 길이 = 건수 ÷ 가장 많은 건수 ──────── */
.bar{flex:1 1 auto;height:8px;border-radius:2px;background:var(--bartrack);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--barfill);border-radius:2px}
.bar.hot i{background:var(--red)}
/* 브랜드별 — 시안과 같이 표로 짠다 */
.brand-row td{height:72px}
.brand-row{cursor:pointer}
.brand-row:hover{background:#fafbfc}
.bn{font-size:16px;font-weight:750}
.bv{margin-top:4px;font-size:12px;color:var(--sub)}
.bl{display:flex;align-items:center;gap:16px}
.bl .cnt{min-width:32px;font-weight:700}
.bl .cnt em{font-style:normal;font-size:12px;font-weight:600;margin-left:2px}
.brand-issues{font-size:11px;color:var(--sub);margin-top:9px}
.brand-row .bar{height:10px}
.brand-row .bar i{background:#5d6369}
.detail td{background:var(--soft);height:auto;padding:16px;font-size:11.5px;color:var(--sub);line-height:1.7}
.hint{font-size:11px;color:var(--sub);margin-top:10px;line-height:1.7}
.foot{font-size:11px;color:var(--sub);margin-top:10px;line-height:1.7}

/* ── 사진 ───────────────────────────────────────────────────────── */
.nop{color:var(--mute)}
.pht{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;
padding:0;border:0;background:none;cursor:zoom-in;line-height:0;max-width:100%}
.pht img{width:46px;height:46px;flex:0 0 46px;border-radius:5px;object-fit:cover;
border:1px solid var(--line);background:var(--th);display:block}
.pht b{font-size:10.5px;font-weight:700;color:var(--sub);background:var(--th);
border-radius:4px;padding:2px 6px;line-height:1.3;white-space:nowrap}
#lb{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
background:rgba(20,22,25,.93);padding:20px}
#lb.on{display:flex}
#lb img{max-width:92vw;max-height:88vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#fff}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:72px;border:0;
border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font-size:26px;line-height:1;cursor:pointer}
#lb .nav:hover{background:rgba(255,255,255,.26)}
#lb .prev{left:16px} #lb .next{right:16px}
#lb .cnt{position:absolute;left:0;right:0;bottom:18px;text-align:center;color:#e6e8ea;
font-size:13px;font-weight:600;letter-spacing:.02em}
#lb .x{position:absolute;right:16px;top:14px;width:38px;height:38px;border:0;border-radius:9px;
background:rgba(255,255,255,.14);color:#fff;font-size:20px;line-height:1;cursor:pointer}
.empty{padding:17px;text-align:center;font-size:12px;color:var(--sub);background:var(--soft);
border:1px dashed var(--line);border-radius:7px}

/* ── 모바일 ─────────────────────────────────────────────────────── */
@media(max-width:820px){
  body{padding:0 10px}
  .pg{padding:18px 15px 30px;gap:26px}
  .top{align-items:flex-start;flex-direction:column;margin-bottom:15px}
  .top h1{font-size:23px}
  .rate{text-align:left}
  .bar1{justify-content:flex-start}
  /* 요약 카드는 두 칸씩 */
  .kp{flex:1 1 calc(50% - 6px);min-width:0;padding:12px 13px}
  .kp .v b{font-size:26px}
  .kp .v s{padding-left:0;border-left:0}
  .kp .v{gap:4px;flex-direction:column;align-items:flex-start}
  /* 표는 가로로 밀어 본다 — 글씨는 줄이지 않는다 */
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tw table{min-width:640px}
  td{font-size:13px}
  .iss{font-size:13px}
  /* 브랜드별 — 이름·수량이 위, 막대·유형이 아래 */
  .brand-table table{min-width:0}
  .brand-table thead{display:none}
  .brand-table table,.brand-table tbody,.brand-table tr,.brand-table td{display:block;width:100%}
  .brand-table tr{position:relative;padding:14px;border-bottom:1px solid var(--line)}
  .brand-table td{border:0;padding:0;height:auto}
  .brand-table td:nth-child(2){margin-top:12px}

    S.filt[tbl][key]=(on.length===opts.length?[]:on);
    dd.remove(); draw();
  });
}
document.addEventListener('click',function(e){
  if(e.target.classList&&e.target.classList.contains('fx')) return openDD(e.target);

/* ── 사진 ── */
/* 여러 장이면 작은 그림 위에 장수를 적고, 크게 보기에서 옆으로 넘긴다
   [은영 2026-10-01 "사진을 두장 넣은 경우도 있는데 … 옆으로 넘기기 버튼"]. */
var PH = {}, PHN = 0, LB = {list: [], i: 0};
function thumb(r){
  var ps = (r.kind==='etc') ? [] : (r.ph || []);
  if(!ps.length) return '<span class="nop">—</span>';
  var k = 'p' + (++PHN); PH[k] = ps;
  return '<button type="button" class="pht" data-ph="'+k+'" aria-label="사진 크게 보기">'+
         '<img src="'+ps[0]+'" alt="증빙 사진" loading="lazy">'+
         (ps.length>1 ? '<b>'+ps.length+'장</b>' : '')+'</button>';
}
function lbShow(){
  var n = LB.list.length;
  document.getElementById('lbimg').src = LB.list[LB.i] || '';
  document.getElementById('lbcnt').textContent = n>1 ? (LB.i+1)+' / '+n : '';
  var one = n<2;
  document.getElementById('lbprev').hidden = one;
  document.getElementById('lbnext').hidden = one;
}
function lbOpen(list){ LB.list=list; LB.i=0; document.getElementById('lb').classList.add('on'); lbShow(); }
function lbClose(){ document.getElementById('lb').classList.remove('on'); document.getElementById('lbimg').src=''; }
function lbStep(d){ var n=LB.list.length; if(n<2) return; LB.i=(LB.i+d+n)%n; lbShow(); }
document.addEventListener('keydown',function(e){
  if(!document.getElementById('lb').classList.contains('on')) return;
  if(e.key==='Escape') lbClose();
  else if(e.key==='ArrowLeft') lbStep(-1);
  else if(e.key==='ArrowRight') lbStep(1);
});

/* ── 하루치 표 (01 반송 · 02 개선요청 · 입고취소) ──────────────────
   [은영 2026-10-02 리디자인] 열을 성격대로 다시 짰다.
     반송     브랜드 / 업체 / 이슈 내용·품번 / 수량 / 증빙
     개선요청 브랜드 / 업체 / 이슈 내용 / 조치 사항 / 증빙
     입고취소 브랜드 / 업체 / 이슈 내용·품번 / 수량      (증빙 없음)
   핵심은 **'품번 → 발생 내용' 순서를 '발생 내용 → 품번' 으로 뒤집은 것**.
   발생 내용이 첫 줄에 진하게, 품번은 둘째 줄에 작은 회색으로 깔린다.
   하루치만 보는 표라 날짜 열은 두지 않는다 — 줄마다 같은 날짜가 반복된다. */
function issText(r){
  /* 사유가 적혀 있으면 그 말을, 없으면 유형(+세부)을 그대로 쓴다.
     유형은 옆 칸에 따로 서 있으므로 같은 말을 두 번 찍지 않는다. */
  if(r.why) return r.why;
  return r.type + (r.sub ? ' · ' + r.sub : '');
}
function vndCell(r){
  return '<span class="vnm">'+esc(r.vnd)+'</span>'+
    (r.again?'<span class="tip"><span class="nth hot" style="cursor:help">'+
      esc(r.againLbl||'재발')+'</span><span class="tt">'+esc(r.tip)+'</span></span>':'');
}
function dayTable(tbl,list,none){
  DSET[tbl]=list;
  var rows=list.filter(function(r){return pass(tbl,r);});

    return '<div class="empty">'+(list.length?'고른 조건에 맞는 건이 없습니다':none)+'</div>';
  var isImp = tbl==='imp', isEtc = tbl==='etc';
  /* 열 비율을 못박는다. 복종은 전체 표와 마찬가지로 칸으로 둔다
     [은영 2026-10-02 "반송내역에 복종추가해줘"]. 날짜는 하루치라 되풀이되고,
     이슈유형은 이슈 내용 첫 줄이 그 말을 하므로 칸을 따로 두지 않는다. */
  var W = isImp ? ['11%','8%','21%','24%','23%','13%']
        : (isEtc ? ['13%','9%','25%','38%','15%']
                 : ['11%','8%','21%','34%','13%','13%']);
  var h='<table><colgroup>'+W.map(function(w){return '<col style="width:'+w+'">';}).join('')+
    '</colgroup><thead><tr class="hd">'+
    '<th class="center"><span class="fx'+(((S.filt[tbl]||{}).brand||[]).length?' on':'')+
      '" data-t="'+tbl+'" data-k="brand">브랜드 &#9662;</span></th>'+
    '<th class="center"><span class="fx'+(((S.filt[tbl]||{}).bok||[]).length?' on':'')+
      '" data-t="'+tbl+'" data-k="bok">복종 &#9662;</span></th>'+
    '<th class="center"><span class="fx'+(((S.filt[tbl]||{}).vnd||[]).length?' on':'')+
      '" data-t="'+tbl+'" data-k="vnd">업체 &#9662;</span></th>'+
    '<th class="center">'+(isImp?'이슈 내용':'이슈 내용 · 품번')+'</th>'+
    (isImp ? '<th class="center">조치 사항</th>'
           : '<th class="qc" style="text-align:right;font-size:12px">수량</th>')+
    (isEtc ? '' : '<th class="center">증빙</th>')+
    '</tr></thead><tbody>';
  rows.forEach(function(r){
    var op=!!S.open[r.id];
    h+='<tr class="rw"'+(isImp?'':' style="cursor:pointer" data-open="'+r.id+'"')+'>'+
      '<td class="center">'+esc(r.brand)+
        (ADMIN?'<button type="button" class="pen" data-ed="'+r.id+'" title="이 줄 고치기">&#9998;</button>':'')+'</td>'+
      '<td class="center">'+esc(r.bok||'—')+'</td>'+
      '<td class="supplier">'+vndCell(r)+'</td>'+
      '<td><div class="iss">'+esc(issText(r))+'</div>'+
        (isImp ? '' :
          '<div class="cod">'+esc(r.first)+(r.more?' 외 '+(r.all.split(', ').length-1):'')+'</div>'+
          (op?'<div class="all">'+
            '<b style="color:var(--ink)">이슈유형</b> '+esc(r.type)+
            (r.sub?' ('+esc(r.sub)+')':'')+
            (r.more?'<br><b style="color:var(--ink)">품번</b> '+esc(r.all):'')+
            '</div>':''))+
      '</td>'+
      (isImp
        ? '<td>'+(r.act
            ? '<div class="act"><b>조치 ·</b>'+esc(r.act.replace(/^조치[:：]\s*/,''))+'</div>'
            : '<span class="nop">—</span>')+'</td>'
        : '<td class="qt qc">'+esc(r.qty)+'<em>PCS</em></td>')+
      (isEtc ? '' : '<td class="ph center">'+thumb(r)+'</td>')+
    '</tr>';
  });
  return h+'</tbody></table>';
}

/* ── 04 전체 표 — 반송 표와 **같은 꼴**이고 날짜 칸만 왼쪽에 하나 더 붙는다
   [은영 2026-10-02 "반송이랑 표 디자인 동일하되, 날짜컬럼만 왼쪽에 추가"].
   복종·이슈유형은 반송 표와 마찬가지로 줄을 눌러 펼치면 보인다. ── */
function table(tbl,list,detailHead,none){
  DSET[tbl]=list;
  var rows=list.filter(function(r){return pass(tbl,r);});
  if(!rows.length)
    return '<div class="empty">'+(list.length?'고른 조건에 맞는 건이 없습니다':none)+'</div>';
  var pho = tbl!=='etc';
  /* 복종은 그 달을 훑는 표에서 눈으로 묶어 보는 칸이라 접어 두지 않는다
     [은영 2026-10-02 "복종 컬럼은 들어가야해"]. */
  var W = pho ? ['9%','9%','7%','17%','11%','24%','11%','12%']
              : ['10%','10%','8%','19%','12%','26%','15%'];
  var h='<table><colgroup>'+W.map(function(w){return '<col style="width:'+w+'">';}).join('')+
    '</colgroup><thead><tr class="hd">'+
    '<th class="center"><span class="fx'+(((S.filt[tbl]||{}).day||[]).length?' on':'')+
      '" data-t="'+tbl+'" data-k="day">날짜 &#9662;</span></th>'+
    '<th class="center"><span class="fx'+(((S.filt[tbl]||{}).brand||[]).length?' on':'')+
      '" data-t="'+tbl+'" data-k="brand">브랜드 &#9662;</span></th>'+
    '<th class="center"><span class="fx'+(((S.filt[tbl]||{}).bok||[]).length?' on':'')+
      '" data-t="'+tbl+'" data-k="bok">복종 &#9662;</span></th>'+
    '<th class="center"><span class="fx'+(((S.filt[tbl]||{}).vnd||[]).length?' on':'')+
      '" data-t="'+tbl+'" data-k="vnd">업체 &#9662;</span></th>'+
    '<th class="center"><span class="fx'+(((S.filt[tbl]||{}).type||[]).length?' on':'')+
      '" data-t="'+tbl+'" data-k="type">이슈유형 &#9662;</span></th>'+
    '<th class="center">'+detailHead+'</th>'+
    '<th class="qc" style="text-align:right;font-size:12px">수량</th>'+
    (pho?'<th class="center">증빙</th>':'')+'</tr></thead><tbody>';
  rows.forEach(function(r){
    /* 복종·이슈유형이 칸으로 나온 뒤로는 펼칠 거리가 없는 줄도 생긴다 —
       그런 줄은 누르지 못하게 둔다. 빈 상자가 열리면 고장으로 보인다. */
    var more=[];
    if(r.sub)  more.push('<b style="color:var(--ink)">상세</b> '+esc(r.sub));
    if(r.more) more.push('<b style="color:var(--ink)">품번</b> '+esc(r.all));
    if(r.act)  more.push('<b style="color:var(--ink)">조치</b> '+
                         esc(r.act.replace(/^조치[:：]\s*/,'')));
    var op=!!S.open[r.id] && more.length;
    h+='<tr class="rw"'+(more.length?' style="cursor:pointer" data-open="'+r.id+'"':'')+'>'+
       '<td class="center" style="white-space:nowrap">'+esc(r.day)+
       (ADMIN?'<button type="button" class="pen" data-ed="'+r.id+'" title="이 줄 고치기">&#9998;</button>':'')+'</td>'+
       '<td class="center">'+esc(r.brand)+'</td>'+
       '<td class="center">'+esc(r.bok||'—')+'</td>'+
       '<td class="supplier">'+vndCell(r)+'</td>'+
       '<td class="center ty2">'+esc(r.type)+'</td>'+
       '<td><div class="iss">'+esc(issText(r))+'</div>'+
       '<div class="cod">'+esc(r.first)+(r.more?' 외 '+(r.all.split(', ').length-1):'')+'</div>'+
       (op?'<div class="all">'+more.join('<br>')+'</div>':'')+

       '<td class="qt qc">'+(r.kind==='imp'?'<span class="nop">—</span>':esc(r.qty)+'<em>PCS</em>')+'</td>'+
       (pho?'<td class="ph center">'+thumb(r)+'</td>':'')+'</tr>';
  });
  return h+'</tbody></table>';
}

/* ── 04 누적 ────────────────────────────────────────────────────────
   막대는 **이슈 건수** 하나만 그린다. 길이는 건수 ÷ 지금 집계에서 가장 많은
   건수라, 같은 건수는 늘 같은 길이다. 색은 회색 한 가지 —
   빨강은 실제 재발이 있을 때만 [은영 2026-10-02 "가장 많은 브랜드라는
   이유만으로 빨간색 경고를 넣지 않기"]. */
function barHTML(n, top, hot){
  var w = top>0 ? (n/top*100) : 0;
  return '<span class="bar'+(hot?' hot':'')+'"><i style="width:'+w.toFixed(1)+'%"></i></span>';
}
/* 유형 차례는 모든 줄에서 같게 둔다 — 줄마다 순서가 바뀌면 눈이 헤맨다 */
var TYPE_ORDER = ['패킹불량','QC불량','RFID 불량','예약오류','미입고·취소','기타'];
function typeLine(types, unit){
  var ks=Object.keys(types);
  ks.sort(function(x,y){
    var a=TYPE_ORDER.indexOf(x), b=TYPE_ORDER.indexOf(y);
    if(a<0) a=99; if(b<0) b=99;
    return a-b || x.localeCompare(y);
  });
  return ks.filter(function(k){return types[k]>0;})
           .map(function(k){return k+' '+types[k]+(unit||'');}).join(' · ');
}
function sortList(list){
  return list.sort(S.sort3==='q'
    ? function(x,y){return y.q-x.q||y.n-x.n;}
    : function(x,y){return y.n-x.n||y.q-x.q;});
}

function vendHTML(rows){
  DSET['vend']=rows;                       /* 고르기 목록은 줄에서 뽑는다 */
  rows=rows.filter(function(r){return pass('vend',r);});
  var bag={};
  rows.forEach(function(r){
    var a=bag[r.vnd]||(bag[r.vnd]={n:0,q:0,brands:[],boks:[],types:{},days:{},
                                    bigd:{},byDay:{},again:false});
    a.n++; a.q+=(r.kind==='imp'?0:r.q); a.again=a.again||r.again;
    a.types[r.type]=(a.types[r.type]||0)+1;
    a.days[r.iso]=(a.days[r.iso]||0)+1;
    /* 날짜마다 어느 품번이 걸렸는지 모은다 [은영 2026-10-02 "발생일과
       어떤상품인지 상품코드를 적어줘"] — 같은 품번이 되풀이되면 한 번만. */
    var dc=(a.byDay[r.iso]=a.byDay[r.iso]||[]);
    splitCodes(r.all||r.first).forEach(function(c){
      if(dc.indexOf(c)<0) dc.push(c);
    });
    (a.bigd[r.big]=a.bigd[r.big]||{})[r.iso]=1;
    if(a.brands.indexOf(r.brand)<0) a.brands.push(r.brand);
    if(r.bok&&a.boks.indexOf(r.bok)<0) a.boks.push(r.bok);
  });
  var list=Object.keys(bag).map(function(k){
    var a=bag[k], repB='', repN=0;
    Object.keys(a.bigd).forEach(function(b){var n=Object.keys(a.bigd[b]).length; if(n>repN){repB=b;repN=n;}});
    var ds=Object.keys(a.days).sort();
    return {name:k, n:a.n, q:a.q, again:a.again, types:a.types,
      b:(a.brands.length>2?a.brands[0]+' 외 '+(a.brands.length-1):a.brands.join(' · ')),
      k2:a.boks.slice(0,2).join(' · '),
      t:typeLine(a.types, '건'),
      dd:ds.map(function(d){return md(d)+(a.days[d]>1?' ×'+a.days[d]:'');}).join(' · '),
      /* 늦은 날이 위로 — 요즘 것이 먼저 눈에 들어와야 한다.
         품번이 열 개를 넘으면 줄이 길어져 되레 안 읽힌다. 여덟 개까지만. */
      lines:ds.slice().reverse().map(function(d){
        var cs=a.byDay[d]||[];
        var head=cs.slice(0,8).join(', ');
        return {d:md(d), n:a.days[d], c:head+(cs.length>8?' 외 '+(cs.length-8):'') || '—'};
      }),
      rep:repN>=2, repTip:repB+' 이슈가 '+repN+'일에 걸쳐 나왔습니다'};
  });
  sortList(list);
  /* 막대 길이 기준은 **정렬과 무관하게** 늘 '가장 많은 건수' 다 */
  var top=0; list.forEach(function(v){ if(v.n>top) top=v.n; });

  var show=list.slice(0, S.allVend?list.length:TOP);
  if(!show.length) return '<div class="empty">고른 조건에 맞는 업체가 없습니다</div>';
  var h='<div class="tw"><table><colgroup>'+
    ['20%','12%','8%','26%','20%','14%'].map(function(w){return '<col style="width:'+w+'">';}).join('')+
    '</colgroup><thead><tr class="hd">'+
    '<th class="center">업체</th><th class="center">브랜드</th><th class="center">복종</th>'+
    '<th class="center">주요 이슈</th><th class="center">건수</th>'+
    '<th class="qc" style="text-align:right;font-size:12px">누적 수량</th>'+
    '</tr></thead><tbody>';
  show.forEach(function(v,i){
    var op=!!S.open['v:'+v.name];
    h+='<tr class="rw" style="cursor:pointer" data-vrow="'+esc(v.name)+'">'+
      '<td class="supplier">'+
        '<span class="vnm">'+esc(v.name)+'</span>'+
        (v.rep?'<span class="tip"><span class="nth" style="cursor:help">반복</span>'+
               '<span class="tt">'+esc(v.repTip)+'</span></span>':'')+
        (v.again?'<span class="nth hot">재발</span>':'')+'</td>'+
      '<td class="center ty2">'+esc(v.b||'—')+'</td>'+
      '<td class="center ty2">'+esc(v.k2||'—')+'</td>'+
      '<td>'+esc(v.t)+'</td>'+
      '<td><div style="display:flex;align-items:center;gap:16px">'+
        '<span style="font-size:16px;font-weight:750;min-width:48px;white-space:nowrap;'+
        'color:var(--ink)">'+v.n+
        '<em style="font-style:normal;font-size:12px;font-weight:600;margin-left:2px">건</em></span>'+
        barHTML(v.n, top, v.again)+'</div></td>'+
      '<td class="qt qc" style="color:var(--red)">'+won(v.q)+'<em>PCS</em></td></tr>';
    if(op)
      h+='<tr class="rw detail"><td colspan="6" style="background:var(--soft);font-size:11.5px;color:var(--sub);line-height:1.8">'+
         '<b style="color:var(--ink)">발생일 · 품번</b><br>'+
         (v.lines.length
           ? v.lines.map(function(L){
               return '<b style="color:var(--ink)">'+esc(L.d)+'</b>'+
                      (L.n>1?' ×'+L.n:'')+' &nbsp; '+esc(L.c);
             }).join('<br>')
           : '—')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  if(list.length>TOP)
    h+='<button class="fold" data-all="1" style="margin-top:10px;width:100%;'+
       'padding:11px 16px;background:var(--soft);border:1px solid var(--line);'+
       'border-radius:7px;text-align:left;color:var(--ink)">'+
       (S.allVend?'상위 '+TOP+'곳만 보기 &#8249;':'전체 업체 더 보기 &#8250;')+'</button>';
  return h;
}

/* 브랜드별은 표가 아니라 한 줄짜리 묶음이다 — 업체별과 보는 눈이 다르다
   [은영 2026-10-02 "브랜드별 누적 화면은 업체별 표와 다른 형태로 유지"]. */
function brandHTML(rows){
  rows=rows.filter(function(r){return pass('vend',r);});   /* 04 안에서는 같은 고르기 */
  var bag={};
  rows.forEach(function(r){
    var a=bag[r.brand]||(bag[r.brand]={n:0,q:0,v:{},types:{},again:false});
    a.n++; a.q+=(r.kind==='imp'?0:r.q); a.v[r.vnd]=1;
    a.again=a.again||r.again;
    a.types[r.type]=(a.types[r.type]||0)+1;
  });
  var list=Object.keys(bag).map(function(k){
    var a=bag[k];
    return {name:k, n:a.n, q:a.q, again:a.again, vn:Object.keys(a.v).length,
             t:typeLine(a.types), vs:Object.keys(a.v)};
  });
  if(!list.length) return '<div class="empty">고른 조건에 맞는 브랜드가 없습니다</div>';
  sortList(list);
  var top=0; list.forEach(function(b){ if(b.n>top) top=b.n; });
  /* 시안과 같이 표로 짠다 — 열은 22% / 59% / 19% */
  var h='<div class="tw brand-table"><table><colgroup>'+
    ['22%','59%','19%'].map(function(w){return '<col style="width:'+w+'">';}).join('')+
    '</colgroup><thead><tr class="hd">'+
    '<th class="center">브랜드 · 발생 업체</th>'+
    '<th class="center">이슈 건수 · 유형</th>'+
    '<th class="qc" style="text-align:right;font-size:12px">누적 수량</th>'+
    '</tr></thead><tbody>';
  list.forEach(function(b){
    var op=!!S.open['b:'+b.name];
    h+='<tr class="rw brand-row" data-brow="'+esc(b.name)+'">'+
      '<td><div class="bn">'+esc(b.name)+
        (b.again?'<span class="nth hot">재발</span>':'')+'</div>'+
        '<div class="bv">업체 '+b.vn+'곳</div></td>'+
      '<td><div class="bl">'+
        '<span class="cnt">'+b.n+'<em>건</em></span>'+barHTML(b.n, top, b.again)+'</div>'+
        '<div class="brand-issues">'+esc(b.t)+'</div></td>'+
      '<td class="qt qc" style="color:var(--red)">'+won(b.q)+'<em>PCS</em></td></tr>';
    if(op)
      h+='<tr class="detail"><td colspan="3">'+
         '<b style="color:var(--ink)">발생 업체</b> '+esc(b.vs.join(' · '))+'</td></tr>';
  });
  return h+'</tbody></table></div><div class="hint">막대 길이 = 이슈 건수 &nbsp;·&nbsp; '+
         '줄을 누르면 발생 업체를 볼 수 있습니다.</div>';
}

/* ── 위쪽 고르기 ── */
/* 날짜는 달력으로 [은영 2026-10-01 "날짜 선택은 달력형태로 바꿔줘"].
   자료가 있는 날만 누를 수 있고, 이슈가 있는 날에는 점을 찍는다. */
function calHTML(){
  var have={}; D.dates.forEach(function(d){have[d]=0;});
  D.log.forEach(function(r){ if(r.iso in have) have[r.iso]++; });
  var p=S.day.split('-'), y=+p[0], m=+p[1];
  var first=new Date(y, m-1, 1), last=new Date(y, m, 0).getDate();
  var lead=(first.getDay()+6)%7;                 /* 월요일을 한 주의 시작으로 */
  /* 다른 달은 이 장에 없다 — 서버에 다시 그려 달라고 주소를 바꾼다.
     공유본·내려받은 파일에는 뒤에 서버가 없어 아예 안 보인다. */
  var MM=(D.months||[]), cur=y+'-'+('0'+m).slice(-2);
  var ci=-1; MM.forEach(function(x,i){ if(x.m===cur) ci=i; });
  function mvBtn(step,glyph){
    if(!LIVE || ci<0) return '';                  /* 공유본에는 아예 안 그린다 */
    var t=MM[ci+step];                            /* MM 은 최신 달이 앞 — 뒤로가 +1 */
    return '<button type="button" class="cmv" data-go="'+(t?t.d:'')+'"'+
           (t?'':' disabled')+'>'+glyph+'</button>';
  }
  var h='<div class="ch">'+
        mvBtn(1,'&#8249;')+'<b>'+y+'년 '+m+'월</b>'+mvBtn(-1,'&#8250;')+
        '<span style="font-size:10px;color:#7d8b91;margin-left:auto">이슈 있는 날에 점</span></div>'+
        '<div class="cw">'+
        ['월','화','수','목','금','토','일'].map(function(w,i){
          return '<span'+(i===6?' class="sun"':'')+'>'+w+'</span>';}).join('')+
        '</div><div class="cw">';
  for(var i=0;i<lead;i++) h+='<button type="button" class="cd0" disabled></button>';
  for(var d=1;d<=last;d++){
    var iso=y+'-'+('0'+m).slice(-2)+'-'+('0'+d).slice(-2);
    if(!(iso in have)){ h+='<button type="button" class="cd0" disabled>'+d+'</button>'; continue; }
    h+='<button type="button" class="cd0 day'+(iso===S.day?' on':'')+'" data-d="'+iso+'">'+d+
       (have[iso]?'<i></i>':'')+'</button>';
  }
  h+='</div><div class="cn">'+
     (LIVE&&MM.length>1 ? '이 달은 '+D.dates.length+'일 · 다른 달은 &#8249; &#8250; 로'
                        : '자료가 있는 '+D.dates.length+'일만 고를 수 있습니다')+'</div>';
  return h;
}
function chip(label, on){return '<button class="pick'+(on?' on':'')+'">'+esc(label)+' &#9662;</button>';}
function chips(){
  var el=document.getElementById('chips');
  el.innerHTML =
    '<button class="pick" data-c="day">'+fmtDay(S.day)+' &#9662;</button>'+
    '<button class="pick'+(S.brand.length?' on':'')+'" data-c="brand">브랜드 · '+
      (S.brand.length?S.brand.join(', '):'전체')+' &#9662;</button>'+
    '<button class="pick'+(S.bok.length?' on':'')+'" data-c="bok">복종 · '+
      (S.bok.length?S.bok.join(', '):'전체')+' &#9662;</button>';
}
function openChip(btn){
  document.querySelectorAll('.dd').forEach(function(d){d.remove();});
  var c=btn.dataset.c, dd=document.createElement('div'); dd.className='dd';
  if(c==='day'){
    dd.className='dd cal';
    dd.innerHTML=calHTML();
    dd.addEventListener('click',function(e){
      var go=e.target.closest&&e.target.closest('[data-go]');
      if(go && go.dataset.go){          /* 달 넘기기 — 서버가 그 달을 새로 그려 준다 */
        location.search='?d='+go.dataset.go;
        return;
      }
      var b=e.target.closest&&e.target.closest('button.day');
      if(!b) return;
      S.day=b.dataset.d; dd.remove(); draw();
    });
  } else {
    var opts=uniq(D.log.map(function(r){return r[c];})), sel=S[c];
    if(c==='brand') opts=sortBrands(opts);
    dd.innerHTML='<div class="ddl">'+opts.map(function(o){
      return '<label><input type="checkbox" value="'+esc(o)+'"'+(sel.length===0||sel.indexOf(o)>=0?' checked':'')+'> '+esc(o)+'</label>';}).join('')+
      '</div><div class="ddb"><button data-a="all"></button><button data-a="ok">적용</button></div>';
    dd.addEventListener('change',function(){syncAll(dd);});
    dd.addEventListener('click',function(e){
      var a=e.target.dataset&&e.target.dataset.a; if(!a) return;
      if(a==='all') return toggleAll(dd);
      var on=[].slice.call(dd.querySelectorAll('input:checked')).map(function(i){return i.value;});
      S[c]=(on.length===opts.length?[]:on);
      dd.remove(); draw();
    });
  }
  document.body.appendChild(dd);
  syncAll(dd);
  var b=btn.getBoundingClientRect();
  dd.style.left=(b.left+window.scrollX)+'px'; dd.style.top=(b.bottom+window.scrollY+4)+'px';
}

/* ── 그리기 ── */
function sum(l){var q=0;l.forEach(function(r){q+=r.q;});return {n:l.length,q:won(q)};}
/* ── 요약 카드 ──────────────────────────────────────────────────────
   [은영 2026-10-02 리디자인] 네 장 모두 흰 바탕에 얇은 테두리. 숫자를 크게.
   빨강은 '개선요청 후 재발' 이 **실제로 있을 때만** 켠다 — 0건인데 붉게
   칠하면 좋은 소식이 경고처럼 읽힌다. */
function kpiCard(t, n, unit, side, hot, red, live){
  return '<div class="kp'+(hot?' hot':'')+(red?' red':'')+(live?' live':'')+'">'+
    '<div class="t">'+esc(t)+'</div>'+
    '<div class="v"><b>'+n+'<em>'+unit+'</em></b>'+
    (side?'<s>'+side+'</s>':'')+'</div></div>';
}

function draw(){
  chips();
  var all=scope();
  var today=all.filter(function(r){return r.iso===S.day;});
  var ret=today.filter(function(r){return r.kind==='ret';});
  var imp=today.filter(function(r){return r.kind==='imp';});
  var etc=today.filter(function(r){return r.kind==='etc';});
  var ag=today.filter(function(r){return r.again;});
  var sr=sum(ret), si=sum(imp), se=sum(etc);

  /* 머리말 — 제목은 고른 날짜를 따라간다 */
  var p=S.day.split('-');
  document.getElementById('hTitle').textContent=
    (+p[1])+'월 '+(+p[2])+'일 입고 이슈 보고';
  document.getElementById('hDate').textContent=
    p[0]+'.'+p[1]+'.'+p[2]+' '+WD[new Date(+p[0],+p[1]-1,+p[2]).getDay()]+'요일';
  document.getElementById('hRate').textContent=D.rate;
  /* 아직 안 들어온 날은 왜 비었는지 적는다 — 빈 칸은 '0' 으로 읽힌다 */
  document.getElementById('hQty').textContent=
    (D.plan==='—'&&D.conf==='—')
      ? '예정 · 확정 수량은 아침 리포트가 채웁니다 (아직 안 들어옴)'
      : ('예정 '+D.plan+' PCS · 확정 '+D.conf+' PCS');

  /* 재발 업체가 여럿이면 대표 한 곳 + 외 N곳 */
  var av={}; ag.forEach(function(r){av[r.vnd]=1;});
  var avn=Object.keys(av);
  var agSide = ag.length
    ? (avn[0]+(avn.length>1?' 외 '+(avn.length-1)+'곳':''))
    : '';
  document.getElementById('kpi').innerHTML=
    kpiCard('반송', sr.n, '건', sr.q+' PCS', false, true)+
    kpiCard('개선요청', si.n, '건', '')+
    kpiCard('개선요청 후 재발', ag.length, '건', agSide, true, false, ag.length>0)+
    kpiCard('입고취소 · 일부 미입고', se.n, '건', se.q+' PCS');

  /* 주요 확인사항 — 셈한 것만 적는다. 없으면 통째로 숨긴다 */
  var bits=[];
  if(ag.length) bits.push('개선요청 업체 재발 <b>'+ag.length+'건</b>');
  var tn={}; ret.forEach(function(r){tn[r.type]=(tn[r.type]||0)+1;});
  var tk=Object.keys(tn).sort(function(x,y){return tn[y]-tn[x];});
  if(tk.length && tn[tk[0]]>=2) bits.push(esc(tk[0])+' 반송 <b>'+tn[tk[0]]+'건</b>');
  var note=document.getElementById('note');
  /* 짚을 거리가 없는 날도 띠를 비워 두지 않는다 [은영 2026-10-02 "붉은색
     공간이 비어있는데, 저기도 멘트를 넣어주고"]. 무엇을 보고 '없다' 고
     말하는지까지 적는다 — 빈 칸은 안 본 것인지 없는 것인지 알 수 없다. */
  note.hidden = false;
  var say = bits.length ? bits.join(' &nbsp;·&nbsp; ')
    : (today.length ? '개선요청 후 재발 없음 &nbsp;·&nbsp; 같은 유형이 겹친 반송 없음'
                    : '이 날짜에 올라온 이슈가 없습니다');
  note.innerHTML='<span class="nh">주요 확인사항</span><span>'+say+'</span>';

  document.getElementById('s0').textContent=
    '반송 '+sr.n+'건 · 개선요청 '+si.n+'건 · 입고취소 '+se.n+'건';
  document.getElementById('lRet').textContent='반송 '+sr.n+'건 · '+sr.q+' PCS';
  document.getElementById('lImp').textContent='개선요청 '+si.n+'건';
  document.getElementById('tRet').innerHTML=
    dayTable('ret',ret,'해당일자 반송 발생없음');
  document.getElementById('tImp').innerHTML=
    dayTable('imp',imp,'해당일자 개선요청사항 발생없음');

  var etcBox=document.getElementById('tEtc');
  etcBox.innerHTML=dayTable('etc',etc,'해당일자 입고취소 · 일부 미입고 발생없음');
  document.getElementById('etcLbl').textContent=
    '입고취소 · 일부 미입고 '+se.n+'건 · '+se.q+' PCS';
  document.getElementById('etcArrow').innerHTML=etcBox.hidden?'&#9662;':'&#9652;';

  var found=search(all);
  /* 입고취소 · 일부 미입고는 아래 접기로 내린다 — 같은 표에 섞으면 반송·
     개선요청이 묻힌다 [은영 2026-10-02]. 찾기는 두 표에 똑같이 걸린다. */
  var fMain=found.filter(function(r){return r.kind!=='etc';});
  var fEtc=found.filter(function(r){return r.kind==='etc';});
  /* 두 표는 한 묶음이라 칸 거르개도 같이 쓴다 ('log' 한 이름) — 위에서
     이슈유형을 고르면 아래 입고취소 접기에도 똑같이 걸린다. 날마다 보는
     입고취소 표(dayTable 의 'etc')와는 이름이 갈려 서로 간섭하지 않는다. */
  document.getElementById('tLog').innerHTML=
    table('log',fMain,'이슈 내용 · 품번',
          S.q ? '‘'+S.q+'’ 에 맞는 건이 없습니다' : D.month+' 내역 없음');
  document.getElementById('tLogEtc').innerHTML=
    table('log',fEtc,'이슈 내용 · 품번',
          S.q ? '‘'+S.q+'’ 에 맞는 건이 없습니다'
              : D.month+' 입고취소 · 일부 미입고 없음');
  DSET['log']=found;              /* 고르기 목록은 이 칸 전체에서 뽑는다 */
  var nMain=fMain.filter(function(r){return pass('log',r);}).length;
  LOGETC_N=fEtc.filter(function(r){return pass('log',r);}).length;
  var _eb=document.getElementById('logEtcBox');
  document.getElementById('logEtcWrap').hidden = !LOGETC_N;
  document.getElementById('logEtcBtn').innerHTML=
    (_eb.hidden?'&#9662; ':'&#9652; ')+logEtcLabel();
  /* 칸 거르개로 줄이 줄었는데 글귀만 '전체 92건' 이면 표와 어긋나 보인다
     [은영 2026-10-02 이슈유형 거르개]. 실제로 그려진 줄 수를 적는다. */
  var shownN = nMain + LOGETC_N;
  document.getElementById('qn').textContent =
    S.q ? (shownN+'건 찾음 / 전체 '+all.length+'건')
        : (shownN!==all.length ? shownN+'건 보임 / 전체 '+all.length+'건'
                               : '전체 '+all.length+'건');

  var counted=all.filter(function(r){return r.kind!=='etc';});
  /* 칸별로 골랐으면 부제 숫자도 같이 따라간다 — 안 그러면 표와 어긋난다 */
  var shown=counted.filter(function(r){return pass('vend',r);});
  var q=0, v={};
  shown.forEach(function(r){ if(r.kind!=='imp') q+=r.q; v[r.vnd]=1; });
  /* 제목은 탭을 따라 바꾸지 않는다 — 달만 바뀐다 [은영 2026-10-02] */
  document.getElementById('h4').textContent=D.month+' 업체별, 브랜드별 이슈누적';
  document.getElementById('s3').textContent='누적 '+shown.length+'건 · '+won(q)+
    ' PCS · 업체 '+Object.keys(v).length+'곳'+
    (shown.length<counted.length ? ' (고른 것만 · 전체 '+counted.length+'건)' : '');
  /* 건수와 수량의 집계 범위가 다르다 — 숫자를 나란히 두면 같은 범위로 읽힌다 */
  document.getElementById('f3').textContent=
    '이슈 건수는 반송과 개선요청을 함께 셉니다. 누적 수량은 반송 건의 수량만 더한 값이라 '+
    '두 숫자의 집계 범위가 다릅니다. 입고취소 · 일부 미입고는 누적에서 뺍니다.';
  document.getElementById('byVend').innerHTML=vendHTML(counted);
  document.getElementById('byBrand').innerHTML=brandHTML(counted);
}

function runSearch(){
  var el=document.getElementById('q');
  var v=el ? el.value : '';
  if(v===S.q) return;                 /* 달라진 게 없으면 그대로 둔다 */
  S.q=v;
  draw();
}
document.addEventListener('keydown',function(e){
  if(e.target.id!=='q') return;
  if(e.key==='Enter'){ e.preventDefault(); runSearch(); }
});
/* 상자의 ✕(브라우저가 그리는 지우개)로 비우면 바로 풀어 준다 */
document.addEventListener('search',function(e){
  if(e.target.id==='q' && !e.target.value) runSearch();
});
document.addEventListener('click',function(e){
  var t=e.target;
  if(t.id==='lbprev'){ return lbStep(-1); }
  if(t.id==='lbnext'){ return lbStep(1); }
  if(t.id==='lbx' || t.id==='lb'){ return lbClose(); }
  if(t.id==='qgo'){ return runSearch(); }
  var pb = t.closest && t.closest('.pht');
  if(pb){ return lbOpen(PH[pb.dataset.ph] || []); }
  if(t.dataset&&t.dataset.clear){
    var qe=document.getElementById('q'); if(qe) qe.value='';
    if(S.q!==''){ S.q=''; draw(); }
    return;
  }
  if(t.dataset&&t.dataset.c) return openChip(t);
  /* 줄을 누르면 복종·이슈유형·품번 전체가 펼쳐진다 — 시안에는 단추가 없다 */
  var orow = t.closest ? t.closest('[data-open]') : null;
  if(orow){S.open[orow.dataset.open]=!S.open[orow.dataset.open]; return draw();}
  if(t.dataset&&t.dataset.all){S.allVend=!S.allVend; return draw();}
  if(t.dataset&&t.dataset.by){
    S.by=t.dataset.by;
    document.querySelectorAll('[data-by]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.by===S.by);});
    document.getElementById('byVend').hidden=S.by!=='vend';
    document.getElementById('byBrand').hidden=S.by!=='brand';
    /* 제목은 탭을 따라 바꾸지 않는다 — 달만 바뀐다
       [은영 2026-10-02 "제목은 변경하지마 … 고정으로 박아놔"] */
    return;
  }
  var fb = t.closest ? t.closest('[data-fold]') : null;
  if(fb){
    var fid=fb.dataset.fold;
    var box=document.getElementById(
      fid==='etc'?'tEtc':(fid==='logEtc'?'logEtcBox':'logBox'));
    box.hidden=!box.hidden;
    if(fid==='etc')
      document.getElementById('etcArrow').innerHTML=box.hidden?'&#9662;':'&#9652;';
    else if(fid==='logEtc') fb.innerHTML=(box.hidden?'&#9662; ':'&#9652; ')+logEtcLabel();
    else document.getElementById('logArrow').innerHTML=box.hidden?'&#9662;':'&#9652;';
    return;
  }
  /* 누적 줄을 누르면 상세를 펼친다 [은영 2026-10-02 "행을 클릭하면 … 상세"] */
  var vr = t.closest ? t.closest('[data-vrow]') : null;
  if(vr){ var k='v:'+vr.dataset.vrow; S.open[k]=!S.open[k]; return draw(); }
  var br = t.closest ? t.closest('[data-brow]') : null;
  if(br){ var k2='b:'+br.dataset.brow; S.open[k2]=!S.open[k2]; return draw(); }
});

/* 정렬 고르기 — 차례만 바뀌고 막대는 늘 '이슈 건수' 를 그린다
   [은영 2026-10-02 "정렬이 바뀌어도 막대는 계속 이슈 건수를 표현"]. */
var _s3=document.getElementById('sort3');
if(_s3) _s3.addEventListener('change',function(){S.sort3=this.value; draw();});

draw();
</script>
